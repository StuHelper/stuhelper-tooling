name: Run the repository checks
description: Run the repository checks
inputs:
  source-checked-out:
    description: Use the source already checked out by the caller workflow
    default: 'false'
  postgres:
    description: Install or reuse PostgreSQL server and client meta-packages
    default: 'false'
  modules-read-token:
    description: Optional read token for private Go modules
    default: ''
  go-version-file:
    description: Optional repository Go version file
    default: ''
  setup-command:
    description: Optional preparation command
    default: ''
  check-command:
    description: Repository check command
    default: 'make check'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1
      if: inputs.source-checked-out != 'true'
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Validate PostgreSQL option and process identity
      env:
        POSTGRES_INPUT: ${{ inputs.postgres }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$POSTGRES_INPUT" =~ ^(true|false)$ ]]
        if [[ "$POSTGRES_INPUT" == "true" && ( -z "${USER:-}" || -z "${LOGNAME:-}" ) ]]; then
          identity=$(id -un)
          printf 'USER=%s\nLOGNAME=%s\n' "$identity" "$identity" >> "$GITHUB_ENV"
        fi
    - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.12
      with:
        go-version-file: ${{ inputs.go-version-file }}
        postgres: ${{ inputs.postgres }}
    - uses: StuHelper/stuhelper-tooling/actions/frontend-cache@v0.1.11
      if: runner.environment == 'github-hosted' && hashFiles('**/vite.config.*') != ''
    - name: Download private Go dependencies
      if: inputs.go-version-file != ''
      env:
        GH_TOKEN: ${{ inputs.modules-read-token }}
        GIT_CONFIG_GLOBAL: ${{ runner.temp }}/go-modules.gitconfig
        GOPRIVATE: github.com/StuHelper/*
        REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${GH_TOKEN:-}" ]]; then exit 0; fi
        if [[ "${REPOSITORY_PRIVATE:-false}" != "true" ]]; then
          echo 'Public repositories must not use modules-read-token.' >&2
          exit 1
        fi
        printf 'GOPRIVATE=github.com/StuHelper/*\n' >> "$GITHUB_ENV"
        gh auth setup-git --hostname github.com
        go mod download
    - name: Install locked tools
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Prepare repository checks
      if: inputs.setup-command != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.setup-command }}
      run: bash -euo pipefail -c "$COMMAND"
    - name: Check repository
      shell: bash
      env:
        COMMAND: ${{ inputs.check-command }}
      run: bash -euo pipefail -c "$COMMAND"
    - name: Remove temporary credential helper
      if: always() && inputs.go-version-file != ''
      shell: bash
      run: rm -f -- "$RUNNER_TEMP/go-modules.gitconfig"

name: Publish application release assets
on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      version:
        description: Existing annotated tag on main
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    name: Release assets
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
      GOWORK: 'off'
      CGO_ENABLED: '0'
      LEFTHOOK: '0'
    steps:
      - uses: StuHelper/stuhelper-tooling/actions/release-assets@v0.1.11
        with:
          application: ${{ inputs.application }}
          version: ${{ inputs.version }}

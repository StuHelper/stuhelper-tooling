name: Publish application release assets
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner label or group/labels object; public callers always use hosted runners
        type: string
        default: '"ubuntu-26.04"'
      application:
        required: true
        type: string
      version:
        description: Existing annotated tag on main
        required: true
        type: string
    secrets:
      modules-read-token:
        required: false
permissions:
  contents: write
jobs:
  publish:
    name: Release assets
    runs-on: ${{ fromJSON(github.event.repository.private && inputs.runs-on || '"ubuntu-26.04"') }}
    timeout-minutes: 45
    env:
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
      GOWORK: 'off'
      CGO_ENABLED: '0'
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION" =~ ^(backend|web|admin|campus-adapters)$ ]]
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$VERSION")" = tag
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.8
        with:
          go-version-file: ${{ (inputs.application == 'backend' || inputs.application == 'campus-adapters') && '.go-version' || '' }}
      - name: Download private Go dependencies
        if: inputs.application == 'backend'
        env:
          GH_TOKEN: ${{ secrets.modules-read-token }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/release-modules.gitconfig
          GOPRIVATE: github.com/StuHelper/*
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git --hostname github.com
          go mod download
      - name: Build fixed source
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/release-output"
          payload="$RUNNER_TEMP/release-payload"
          mkdir "$output" "$payload"
          case "$APPLICATION" in
            backend)
              for directory in cmd/*; do
                test -f "$directory/main.go" || continue
                name=$(basename "$directory")
                test "$name" != backend || name=stuhelper-backend
                go build -mod=readonly -trimpath -ldflags='-s -w' -o "$payload/$name" "./$directory"
              done
              ;;
            campus-adapters)
              python3 scripts/prepare-oracle-driver.py
              bash scripts/build-oracle-sync.sh "$payload/stuhelper-oracle-sync" "$VERSION@$(git rev-parse HEAD)"
              ;;
            web|admin)
              pnpm install --frozen-lockfile
              if test "$APPLICATION" = admin; then pnpm run setup; fi
              pnpm run build
              directory=dist
              if test "$APPLICATION" = admin; then directory=apps/web-antd/dist; fi
              cp -a "$directory/." "$payload/"
              ;;
          esac
          archive="stuhelper-$APPLICATION-$VERSION-linux-amd64.tar.gz"
          if [[ "$APPLICATION" =~ ^(web|admin)$ ]]; then archive="stuhelper-$APPLICATION-$VERSION.tar.gz"; fi
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" --owner=0 --group=0 --numeric-owner -czf "$output/$archive" -C "$payload" .
          cp LICENSE "$output/LICENSE"
          {
            echo "Source: $GITHUB_REPOSITORY@$VERSION ($(git rev-parse HEAD))"
            echo "Workflow: ${GITHUB_WORKFLOW_REF%@*}"
            echo "Node: $(node --version); pnpm: $(pnpm --version)"
            if [[ "$APPLICATION" =~ ^(backend|campus-adapters)$ ]]; then go version; fi
            echo "Target: linux/amd64; GOWORK=off; CGO_ENABLED=0 (Go builds)"
          } > "$output/BUILD-INFO.txt"
          (cd "$output" && sha256sum "$archive" LICENSE BUILD-INFO.txt > SHA256SUMS)
          for file in "$output"/*; do test "$(stat -c %s "$file")" -lt 2147483648; done
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/release-output"
          state="$RUNNER_TEMP/existing-release.json"
          lookup_error="$RUNNER_TEMP/release-lookup.log"
          marker="StuHelper release assets: $GITHUB_REPOSITORY/$APPLICATION@$VERSION"
          if gh release view "$VERSION" --json isDraft,body,assets > "$state" 2> "$lookup_error"; then
            draft=$(jq -er '.isDraft | tostring' "$state")
            if [[ "$draft" == true ]]; then
              jq -e --arg marker "$marker" '.body == $marker' "$state" >/dev/null || { echo "Unexpected draft owner" >&2; exit 1; }
            fi
          elif [[ "$(cat "$lookup_error")" == 'release not found' ]]; then
            gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --notes "$marker"
            draft=true
            echo '{"assets":[]}' > "$state"
          else
            cat "$lookup_error" >&2
            exit 1
          fi
          verify=$(mktemp -d "$RUNNER_TEMP/release-verify.XXXXXX")
          trap 'rm -rf -- "$verify"' EXIT
          for file in "$output"/*; do
            name=$(basename "$file")
            status=$(jq -r --arg name "$name" '[.assets[] | select(.name == $name) | .state // "uploaded"][0] // "missing"' "$state")
            if [[ "$draft" == true && "$status" == "starter" ]]; then
              gh release delete-asset "$VERSION" "$name" --yes
              status=missing
            fi
            if [[ "$status" == missing ]]; then
              [[ "$draft" == true ]] || { echo "Missing published asset: $name" >&2; exit 1; }
              gh release upload "$VERSION" "$file"
            fi
            gh release download "$VERSION" --pattern "$name" --dir "$verify"
            cmp "$file" "$verify/$name"
          done
          (cd "$verify" && sha256sum --check SHA256SUMS)
          if [[ "$draft" == true ]]; then gh release edit "$VERSION" --draft=false; fi
          gh release view "$VERSION" --json url,assets >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credential helper
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/release-modules.gitconfig"

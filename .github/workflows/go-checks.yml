name: Reusable Go checks
on:
  workflow_call:
    inputs:
      name:
        description: Stable required check name
        type: string
        default: Go checks
      setup-command:
        description: Optional setup after dependency installation, such as isolated database tools
        type: string
        default: ''
      check-command:
        description: The same standalone repository check command used locally
        type: string
        default: make check
permissions:
  contents: read
jobs:
  check:
    name: ${{ inputs.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      LEFTHOOK: '0'
      GOWORK: 'off'
      DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install locked tools
        run: pnpm install --frozen-lockfile
      - name: Prepare the module
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      - name: Check standalone Go module
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: bash -euo pipefail -c "$CHECK_COMMAND"

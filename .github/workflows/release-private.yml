name: Publish application release assets
on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      version:
        description: Existing annotated tag on main
        required: true
        type: string
    secrets:
      modules-read-token:
        required: false
permissions:
  contents: write
jobs:
  publish:
    name: Release assets
    if: github.event.repository.private
    runs-on:
      group: stuhelper-arc
    timeout-minutes: 45
    env:
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
      GOWORK: 'off'
      CGO_ENABLED: '0'
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve this workflow's tooling revision
        id: tooling
        shell: bash
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          test ! -e .stuhelper-release-tools
          test ! -L .stuhelper-release-tools
          repository=$(jq -er '.workflow_repository | select(test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' <<< "$WORKFLOW_JOB")
          sha=$(jq -er '.workflow_sha | select(test("^[0-9a-f]{40}$"))' <<< "$WORKFLOW_JOB")
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.sha }}
          path: .stuhelper-release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /actions/release-assets/
      - uses: ./.stuhelper-release-tools/actions/release-assets
        with:
          source-checked-out: 'true'
          application: ${{ inputs.application }}
          version: ${{ inputs.version }}
          modules-read-token: ${{ secrets.modules-read-token }}

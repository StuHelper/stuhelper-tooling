name: Publish application release assets
on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      version:
        description: Existing annotated tag on main
        required: true
        type: string
    secrets:
      modules-read-token:
        required: false
permissions:
  contents: read
jobs:
  build:
    name: Build release assets
    if: >-
      github.event.repository.private &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target' &&
      (github.ref == format('refs/tags/{0}', inputs.version) || github.ref == 'refs/heads/main')
    runs-on:
      group: stuhelper-arc
    timeout-minutes: 45
    env:
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
      GOWORK: 'off'
      CGO_ENABLED: '0'
      LEFTHOOK: '0'
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve this workflow's tooling revision
        id: tooling
        shell: bash
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          test ! -e .stuhelper-release-tools
          test ! -L .stuhelper-release-tools
          repository=$(jq -er '.workflow_repository | select(test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' <<< "$WORKFLOW_JOB")
          sha=$(jq -er '.workflow_sha | select(test("^[0-9a-f]{40}$"))' <<< "$WORKFLOW_JOB")
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.sha }}
          path: .stuhelper-release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /actions/release-assets/
      - uses: ./.stuhelper-release-tools/actions/release-assets
        with:
          source-checked-out: 'true'
          application: ${{ inputs.application }}
          version: ${{ inputs.version }}
          modules-read-token: ${{ secrets.modules-read-token }}
      - uses: actions/upload-artifact@v7.0.2
        id: artifact
        with:
          name: release-${{ inputs.application }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    name: Publish release assets
    needs: build
    environment: release
    permissions:
      contents: write
    runs-on:
      group: stuhelper-arc
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Resolve this workflow's tooling revision
        id: tooling
        shell: bash
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          test ! -e .stuhelper-release-tools
          test ! -L .stuhelper-release-tools
          repository=$(jq -er '.workflow_repository | select(test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' <<< "$WORKFLOW_JOB")
          sha=$(jq -er '.workflow_sha | select(test("^[0-9a-f]{40}$"))' <<< "$WORKFLOW_JOB")
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.sha }}
          path: .stuhelper-release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /actions/publish-release-assets/
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-output
      - uses: ./.stuhelper-release-tools/actions/publish-release-assets

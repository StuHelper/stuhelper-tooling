name: Publish application image
on:
  workflow_call:
    inputs:
      application:
        description: Application repository suffix
        required: true
        type: string
      version:
        description: Existing annotated release tag on main
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: Application image
    if: github.event.repository.private == false && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: release
    env:
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
      IMAGE_PATH: stuhelper/stuhelper-${{ inputs.application }}
    steps:
      - uses: StuHelper/stuhelper-tooling/actions/publish-image@v0.1.11
        with:
          version: ${{ inputs.version }}
          registry-user: ${{ github.actor }}
          registry-password: ${{ github.token }}
